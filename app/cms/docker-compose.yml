# Local development / testing compose file
# For Coolify deployment, use the Dockerfile directly (repo root)
#
# Usage:
#   docker compose up --build    — build and start
#   docker compose down          — stop and remove

services:
  rend:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:-supersecretkey}
    ports:
      - '3000:3000'
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-supersecretkey}
      - DATABASE_URL=file:/app/data/rend.db
      - NODE_ENV=production
    volumes:
      # Persist SQLite database across restarts
      - rend-data:/app/data
      # Persist uploaded media
      - rend-media:/app/media

volumes:
  rend-data:
  rend-media:
