version: '3'

# This project uses SQLite — no external database service is needed.
# The db file (dev.db) and uploaded media are mounted as volumes.
#
# Usage:
#   docker compose up          — starts the combined Rend server (Next + SvelteKit)
#   docker compose up --build  — rebuilds the image first

services:
  rend:
    build:
      context: ../..
      dockerfile: app/cms/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ../../.env
    volumes:
      # Persist the SQLite database across container restarts
      - ../../dev.db:/app/dev.db
      # Persist uploaded media
      - ../../media:/app/media
